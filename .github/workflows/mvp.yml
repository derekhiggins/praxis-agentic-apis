# Walking-skeleton E2E.
#
# Manually dispatched (workflow_dispatch only). Proves the composition once:
#   ogx-showroom provisions OGX on the shared ROSA cluster
#   → helm installs charts/praxis-agentic-apis in front of it
#   → tests/smoke.sh passes
#   → cluster is always torn down again.
#
# Later phases refine this skeleton; keep it simple.
#
# Security:
#   - No pull_request / pull_request_target triggers: secret-bearing runs are
#     dispatch-only, on trusted refs.
#   - Secrets are held by the protected GitHub Environment "cluster-e2e"
#     (required reviewers) rather than repo level, where possible.
#
# Cross-repo serialization: the `concurrency` group only serializes runs
# within THIS repo. The cross-repo mutex against ogx-showroom's own CI is
# showroom's pre-flight clean-cluster wait, which runs inside the composite
# action below, plus this repo's own pre-flight wait
# (.github/scripts/preflight-cluster-clean.sh), which also guards against
# leftovers from crashed praxis runs (e.g. an orphaned praxis-standalone
# namespace).

name: MVP E2E

on:
  workflow_dispatch:
    inputs:
      praxis_image:
        description: 'praxis-ai image override, as repo:tag or repo@sha256:... (default: chart values pin)'
        required: false
        type: string

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Protected environment (create with required reviewers).
    environment: cluster-e2e
    concurrency:
      group: openshift-cluster-1
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - name: Checkout praxis-agentic-apis
        # actions/checkout v4.1.7
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup CI environment (ogx-showroom composite action)
        id: showroom
        # ogx-showroom @ main (pinned by SHA); provides oc/uv/helm, oc-login,
        # values-local.yaml generation, and the pre-flight clean-cluster wait.
        uses: opendatahub-io/ogx-showroom@af717da47182916d734ca739f7e6a5dc5ecb1270
        with:
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          env: |
            SHOWROOM_PULL_SECRET=${{ secrets.SHOWROOM_PULL_SECRET }}
            SHOWROOM_VLLM_URL=${{ vars.LITEMAAS_URL }}
            SHOWROOM_VLLM_API_TOKEN=${{ secrets.LITEMAAS_API_KEY }}
            SHOWROOM_INFERENCE_MODEL=${{ vars.LITEMAAS_INFERENCE_MODEL }}
            SHOWROOM_VLLM_EMBEDDING_URL=${{ vars.LITEMAAS_URL }}
            SHOWROOM_VLLM_EMBEDDING_API_TOKEN=${{ secrets.LITEMAAS_API_KEY }}
            SHOWROOM_EMBEDDING_MODEL=${{ vars.LITEMAAS_EMBEDDING_MODEL }}
            SHOWROOM_EMBEDDING_PROVIDER_MODEL_ID=${{ vars.LITEMAAS_EMBEDDING_MODEL }}

      - name: Pre-flight clean-cluster wait (cross-repo mutex, praxis side)
        # Same gate as showroom's, but also waits for praxis leftovers
        # (NAMESPACE + praxis-gateway Helm release) from crashed runs.
        env:
          NAMESPACE: praxis-standalone
        run: bash .github/scripts/preflight-cluster-clean.sh

      - name: Provision OGX (ogx-showroom)
        run: |
          scripts_dir="${{ steps.showroom.outputs.scripts_dir }}"
          "$scripts_dir/setup.sh"
          "$scripts_dir/provision.sh"

          # Verify OGX is functional before switching to praxis mode.
          # Run from the showroom scripts dir: test.sh launches jupyter demos
          # via `uv run jupyter ...`, and `uv` resolves the project (and its
          # jupyter dependency) from the current working directory — running
          # from this repo's checkout (no pyproject.toml) fails with
          # "Failed to spawn: jupyter".
          pushd "$scripts_dir"
          ./test.sh hello
          popd

          # Remove the external Route: OGX is internal-only from here on
          # (praxis-gateway fronts it).
          helm upgrade ogx-rhoai "$scripts_dir/charts/ogx-rhoai" \
            -n redhat-ods-applications \
            -f "$scripts_dir/values-local.yaml" \
            --set route.enabled=false \
            --wait --timeout 5m

          # Switch OGX to praxis-fronted mode via the OGXServer CRD: auth
          # switches to upstream_header (identity injected by praxis-gateway)
          # and ingress is restricted by NetworkPolicy to the praxis-gateway
          # pods (default peer: app.kubernetes.io/name=praxis-gateway in the
          # praxis-standalone namespace).
          #
          # Praxis mode makes the operator regenerate the runtime config; its
          # default source is the distribution image's OCI labels, which
          # registry.redhat.io only serves to authenticated clients (the
          # operator fetches anonymously -> HTTP 401, CR phase Failed). Point
          # spec.baseConfig at a ConfigMap holding the image's pre-substitution
          # config (/opt/app-root/config.yaml, extracted from the running pod)
          # instead — it takes precedence over OCI label resolution.
          oc -n redhat-ods-applications exec deployment/ogx-distribution -- \
            cat /opt/app-root/config.yaml > /tmp/ogx-base-config.yaml
          oc -n redhat-ods-applications create configmap ogx-distribution-base-config \
            --from-file=config.yaml=/tmp/ogx-base-config.yaml \
            --dry-run=client -o yaml | oc apply -f -
          oc -n redhat-ods-applications label configmap ogx-distribution-base-config \
            ogx.io/watch=true --overwrite

          oc -n redhat-ods-applications patch ogxserver ogx-distribution --type merge \
            -p '{"spec":{"baseConfig":{"name":"ogx-distribution-base-config","key":"config.yaml"},"praxisMode":{"enabled":true}}}'

          # Wait for the operator to reconcile the new mode and roll out.
          oc -n redhat-ods-applications wait --for=jsonpath='{.status.phase}'=Ready \
            ogxserver/ogx-distribution --timeout=300s
          oc -n redhat-ods-applications rollout status deployment/ogx-distribution \
            --timeout=300s

      - name: Enable MCP Lifecycle Operator
        run: |
          oc patch datasciencecluster default-dsc --type=merge \
            -p '{"spec":{"components":{"mcplifecycleoperator":{"managementState":"Managed"}}}}'
          oc wait datasciencecluster/default-dsc \
            --for=condition=MCPLifecycleOperatorReady --timeout=300s

      - name: Deploy praxis-gateway
        env:
          NAMESPACE: praxis-standalone
          LITEMAAS_API_KEY: ${{ secrets.LITEMAAS_API_KEY }}
          LITEMAAS_URL: ${{ vars.LITEMAAS_URL }}
          PRAXIS_IMAGE: ${{ inputs.praxis_image }}
        run: |
          # Backend credential Secret (the chart expects it pre-existing).
          oc create namespace "$NAMESPACE" --dry-run=client -o yaml | oc apply -f -
          oc -n "$NAMESPACE" create secret generic openai \
            --from-literal=OPENAI_API_KEY="$LITEMAAS_API_KEY" \
            --dry-run=client -o yaml | oc apply -f -

          # Point the inference backend at LiteMaaS.
          # LITEMAAS_URL is a full URL; global.inference.host must be a bare hostname.
          host=${LITEMAAS_URL#https://}
          host=${host%%/*}
          port=443
          if [[ $host == *:* ]]; then
            port=${host##*:}
            host=${host%%:*}
          fi
          args=(--set-string "global.inference.host=$host" --set "global.inference.port=$port")

          # Optional praxis-ai image override.
          # Accepts repo:tag or repo@sha256:...; tags are resolved to digests
          # when skopeo is available, otherwise the tag is used and the pinned
          # digest cleared so it takes effect.
          if [[ -n "$PRAXIS_IMAGE" ]]; then
            if [[ $PRAXIS_IMAGE == *@sha256:* ]]; then
              repo="${PRAXIS_IMAGE%@*}" digest="${PRAXIS_IMAGE#*@}" tag=
            else
              repo="${PRAXIS_IMAGE%:*}" tag="${PRAXIS_IMAGE##*:}" digest=
              if [[ "$tag" == "$PRAXIS_IMAGE" || "$repo" == "$PRAXIS_IMAGE" ]]; then
                repo="$PRAXIS_IMAGE" tag=
              elif command -v skopeo >/dev/null 2>&1; then
                digest=$(skopeo inspect --format '{{.Digest}}' "docker://$PRAXIS_IMAGE") ||
                  { echo "skopeo digest resolution failed; falling back to tag"; digest=; }
              fi
            fi
            args+=(--set-string "praxis-gateway.image.repository=$repo")
            if [[ -n "$digest" ]]; then
              args+=(--set-string "praxis-gateway.image.digest=$digest")
            elif [[ -n "$tag" ]]; then
              args+=(--set-string "praxis-gateway.image.tag=$tag" --set-string "praxis-gateway.image.digest=")
            fi
          fi

          helm dependency build charts/praxis-agentic-apis
          helm upgrade --install praxis-gateway charts/praxis-agentic-apis \
            --namespace "$NAMESPACE" "${args[@]}" --wait --timeout 5m

      - name: Smoke test (no inference calls)
        env:
          NAMESPACE: praxis-standalone
        run: tests/smoke.sh

      - name: Debug - Capture OpenShift state
        # WARNING: stdout only. Console output is auto-redacted; artifacts are not.
        if: always()
        run: |
          echo -e "\n=== praxis-standalone: Recent Events ==="
          oc get events -n praxis-standalone --sort-by='.lastTimestamp' \
            -o custom-columns=TIME:.lastTimestamp,TYPE:.type,REASON:.reason,OBJECT:.involvedObject.name,MESSAGE:.message

          echo -e "\n=== praxis-standalone: All Resources ==="
          oc get all -n praxis-standalone

          echo -e "\n=== praxis-standalone: Pod Logs (last 50 lines) ==="
          oc logs -n praxis-standalone --tail=50 -l app.kubernetes.io/name=praxis-gateway || echo "No logs available"

          echo -e "\n=== redhat-ods-applications: All Resources ==="
          oc get all -n redhat-ods-applications

          echo -e "\n=== redhat-ods-applications: Pod Logs (last 50 lines) ==="
          oc logs -n redhat-ods-applications --tail=50 -l app=ogx || echo "No logs available"

      - name: Cleanup praxis-gateway
        if: always()
        env:
          NAMESPACE: praxis-standalone
        run: |
          rc=0
          helm uninstall praxis-gateway --namespace "$NAMESPACE" \
            --ignore-not-found --wait --timeout 5m || rc=$?
          # Also remove the namespace so the credential Secret, the kept
          # PostgreSQL volume and Secret, and any residues do not leak between runs.
          oc delete namespace "$NAMESPACE" --ignore-not-found --timeout=120s || rc=$?
          exit "$rc"

      - name: Teardown OGX (ogx-showroom)
        if: always()
        run: |
          scripts_dir="${{ steps.showroom.outputs.scripts_dir }}"
          rc=0
          "$scripts_dir/unprovision.sh" || rc=$?
          "$scripts_dir/cleanup.sh" || rc=$?
          exit "$rc"
