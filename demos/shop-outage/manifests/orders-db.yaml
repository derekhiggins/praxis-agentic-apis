apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  labels:
    app: orders-db
    app.kubernetes.io/part-of: shop
  annotations:
    shop.example.com/owner: data-platform
    shop.example.com/runbook: orders-db-runbook.md
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
        app.kubernetes.io/part-of: shop
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: registry.access.redhat.com/ubi9/python-312-minimal:latest
          command: [python3, orders_db.py]
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
          volumeMounts:
            - name: app
              mountPath: /opt/app-root/src
            - name: credentials
              mountPath: /etc/orders-db/credentials
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: app
          secret:
            secretName: shop-app
            items:
              - key: orders_db.py
                path: orders_db.py
        - name: credentials
          secret:
            secretName: orders-db-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  labels:
    app: orders-db
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: orders-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
