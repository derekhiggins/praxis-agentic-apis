apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: shop
  annotations:
    shop.example.com/owner: payments-platform
    shop.example.com/runbook: checkout-api-runbook.md
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        app.kubernetes.io/part-of: shop
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-api
          image: registry.access.redhat.com/ubi9/python-312-minimal:latest
          command: [python3, checkout_api.py]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.4.1"
            - name: DATABASE_HOST
              value: orders-db
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: orders
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: app
              mountPath: /opt/app-root/src
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: app
          secret:
            secretName: shop-app
            items:
              - key: checkout_api.py
                path: checkout_api.py
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 8080
      targetPort: http
