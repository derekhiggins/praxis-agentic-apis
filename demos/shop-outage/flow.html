const STYLE = { '+': 'add', '-': 'del', '!': 'err', '*': 'highlight' };
const lines = (arr) => arr.map(v => STYLE[v[0]] ? { v: v.slice(1), s: STYLE[v[0]] } : { v, s: 'keep' });
const I = (label, phase, headers, body) => {
  const m = { label, phase };
  if (headers) m.replaceHeaders = lines(headers);
  if (body) m.replaceBody = lines(body);
  return m;
};
const A = (from, to, color, edge, text, insp) => ({ mode: 'arrow', from, to, color, ...edge, text, insp });
const U = (target, text, insp, errColor) => ({ mode: 'lightup', target, text, insp, ...(errColor ? { errColor } : {}) });

function build(steps) {
  const muts = [];
  const out = steps.map((s, i) => {
    const { insp, ...step } = s;
    if (step.mode === 'arrow') step.num = i + 1; else step.badge = i + 1;
    if (insp) muts.push({ step: i + 1, ...insp });
    return step;
  });
  return { steps: out, muts };
}

  U('f_ingress', 'Ingress: strip Authorization, set owner praxis-standalone',
    I('ingress: headers · state_owner', 'request', INGRESS_H)),
  U('f_router', 'Router: /v1/responses → managed-chat (Responses chains run)',
    I('ingress: router', 'request', [...INGRESS_H.map(h => h.replace(/^[+-]/, '')).filter(h => !h.startsWith('Authorization')), '+route: /v1/responses → cluster managed-chat'])),
  U('f_req', 'Parse the Responses body and tools: mcp, file_search, web_search',
    I('openai_responses_request · openai_tool_parse', 'request', null,

      I('openai_responses_rehydrate', 'request', ['sqlite:///var/lib/praxis/responses.db'],

      I('openai_responses_rehydrate', 'response', null, [...rehydrate, '+{"role": "user", "content": "' + input[0].replace(/^"input": "|",$/g, '') + '"}'])),

];

    I('SRE answer', 'request', ['sre-assistant (stdin)'], ['Approve pods_delete({"name":"' + POD_B + '",...})? [y/N]', '+y'])),
  A('client', 'f_ingress', APPR, E.cli_in, 'mcp_approval_response mcpr_2, previous_response_id resp_turn2b',
    I('sre-assistant → Praxis', 'request', CLIENT_H, approvalBody('mcpr_2', 'resp_turn2b'))),
  A('f_mcp', 'mcp', TOOL, E.disp_mcp, 'Approval record used; MCP tools/call pods_delete ' + POD_B,
    I('openai_mcp_dispatch → openshift-mcp', 'request', MCP_H, [toolsCall('pods_delete', '{"name": "' + POD_B + '", "namespace": "shop"}')])),
  A('mcp', 'k8s', TOOL, E.mcp_k8s, 'DELETE second pod',
    I('openshift-mcp → Kubernetes API', 'request', ['Authorization: Bearer <mcp-viewer token>'], ['*DELETE /api/v1/namespaces/shop/pods/' + POD_B])),
  A('k8s', 'checkout', TOOL, E.k8s_pod, 'Second pod recreated',
    I('Kubernetes API', 'response', ['HTTP/1.1 200 OK'], ['-' + POD_B, '+checkout-api-569bd585db-rldlq (new)'])),
  ...chatRound(3, ['...history...', '{"role": "tool", "tool_call_id": "call_3", "content": "<pod deleted>"},'],
    [['openshift__pods_list_in_namespace', '...'], ['openshift__resources_get', '{\\"kind\\": \\"Deployment\\" | \\"Endpoints\\", ...}'], ['openshift__pods_log', '... new pods + storefront'], ['openshift__pods_get', '... mwttk, rldlq'], ['openshift__events_list', '{\\"fieldSelector\\": \\"type=Warning\\", ...}']],
    'Verify: pods, Deployment, Endpoints, logs, pods_get, events (rounds grouped)'),
  A('f_mcp', 'mcp', TOOL, E.disp_mcp, 'MCP tools/call ×15 (verification)',
    I('openai_mcp_dispatch → openshift-mcp', 'request', MCP_H, [
      toolsCall('resources_get', '{"apiVersion": "v1", "kind": "Endpoints", "name": "checkout-api", "namespace": "shop"}'),

  A('k8s', 'mcp', RES, E.k8s_mcp, 'checkout-api 2/2 Ready, 2 endpoints, orders return 201',

      '+endpoints/checkout-api: 2 ready addresses', '+checkout-api: POST /orders 201', '+storefront: POST /checkout 303'])),
  U('checkout', 'checkout-api Ready again',

  U('storefront', 'storefront checkout succeeds (upstream 201, storefront 303)',

  A('mcp', 'f_mcp', RES, E.mcp_disp, 'mcp_call ×15 emitted',
    I('openshift-mcp → openai_mcp_dispatch', 'response', ['HTTP/1.1 200 OK'], ['+mcp_call ×15 (pods_list_in_namespace, resources_get, pods_log, pods_get, events_list)'])),
  A('openai', 'f_r2c', RES, E.down, 'Final round: model answers with text',

  U('f_loop', 'No tool calls → action = done',
    I('openai_agentic_loop', 'response', null, ['*action: done'])),

// ---------------------------------------------------------------- turn 3
const T3_TEXT = 'It looks like its fixed, create an incident report using our incident ticket format';
const turn3 = build([
  U('checkout', 'checkout-api Ready',
    I('Cluster state', 'request', null, ['+checkout-api 2/2 Ready']), RES),
  A('sre', 'client', REQ, E.sre_cli, 'SRE: "' + T3_TEXT + '"',
    I('SRE prompt', 'request', ['sre-assistant (stdin)'], ['> ' + T3_TEXT])),
  ...requestPhase('Turn 3', ['"input": "' + T3_TEXT + '",'], '"resp_turn2c"',
    [...T1_HISTORY, '{"role": "user", "content": "restart the pods"}', '{"type": "mcp_approval_request", ...} ×2', '{"type": "mcp_approval_response", ...} ×2', '{"type": "mcp_call", ...} ×19', '{"type": "message", "role": "assistant", ...}']),
  ...toInference(1, ['...turn 1 + turn 2 history...', '{"role": "user", "content": "' + T3_TEXT + '"},']),
  A('openai', 'f_r2c', RES, E.down, 'Model calls file_search ×2 for the incident ticket format',
    I('OpenAI → Praxis (Chat SSE)', 'response', SSE_H, toolCallsSSE([
      ['file_search', '{\\"query\\": \\"incident ticket contents required fields ...\\"}'],
      ['file_search', '{\\"query\\": \\"incident report format on-call policy ...\\"}']]))),
  U('f_loop', 'Dispatchable file_search calls → action = loop',
    I('openai_agentic_loop', 'response', null, ['collected: file_search ×2', '*action: loop'])),
  A('f_fs', 'ogx', TOOL, E.fs_ogx, 'file_search ×2 → OGX vector store search',
    I('openai_file_search_dispatch → OGX', 'request', ...ogxReq('incident ticket contents required fields summary impact timeline root cause evidence linked incidents next steps'))),
  A('ogx', 'f_fs', RES, E.ogx_fs, 'Results: oncall-escalation, known-issues, INC-4821, INC-4933',
    I('OGX → openai_file_search_dispatch', 'response', ['HTTP/1.1 200 OK'],
      ogxRes([FILES.oncall, FILES.known, FILES.inc4821, FILES.inc4933], 'incident ticket contents required fields ...'))),
  ...chatRound(2, ['...history...', '{"role": "tool", "tool_call_id": "call_2", "content": "<file_search results>"},'],
    [['openshift__pods_list_in_namespace', '{\\"namespace\\": \\"shop\\"}'], ['openshift__resources_get', '{\\"kind\\": \\"Deployment\\" | \\"Endpoints\\", ...}'], ['openshift__pods_log', '... ×5 (storefront, checkout-api, orders-db)']],
    'Model re-checks: pods, Deployment, Endpoints, logs ×5'),
  A('f_mcp', 'mcp', TOOL, E.disp_mcp, 'MCP tools/call ×8',
    I('openai_mcp_dispatch → openshift-mcp', 'request', MCP_H, [
      toolsCall('pods_list_in_namespace', '{"namespace": "shop"}'),
      toolsCall('pods_log', '{"name": "orders-db-0", "namespace": "shop", "tail": 15}'), '... 6 more'])),
  A('mcp', 'k8s', TOOL, E.mcp_k8s, 'Read pods, Deployment, Endpoints, logs',
    I('openshift-mcp → Kubernetes API', 'request', ['Authorization: Bearer <mcp-viewer token>'], ['GET /api/v1/namespaces/shop/pods', 'GET .../deployments/checkout-api', 'GET .../endpoints/checkout-api', 'GET .../pods/*/log ×5'])),
  A('k8s', 'mcp', RES, E.k8s_mcp, 'Evidence: rotation at 22:11:06, auth failures, 201s after restart',
    I('Kubernetes API → openshift-mcp', 'response', ['HTTP/1.1 200 OK'], [
      'orders-db-0: credentials rotated (22:11:06)', '!old checkout pods: password authentication failed',
      '+new checkout pods: order created 201', '+storefront: checkout_5xx=0 in last 60s'])),
  A('mcp', 'f_mcp', RES, E.mcp_disp, 'mcp_call ×8 emitted',
    I('openshift-mcp → openai_mcp_dispatch', 'response', ['HTTP/1.1 200 OK'], ['+mcp_call ×8'])),
  A('f_r2c', 'openai', REQ, E.up, 'Round 3: POST /v1/chat/completions with tool outputs',
    I('Praxis → OpenAI', 'request', CHAT_H, chatBody(['...history + 10 tool results...']))),
  A('openai', 'f_r2c', RES, E.down, 'Model writes the incident report',
    I('OpenAI → Praxis (Chat SSE)', 'response', SSE_H, ['data: {"choices": [{"delta": {"content": "# Incident report INC-4867: checkout errors after database credential rotation"}}]}', '...', 'data: [DONE]'])),
  U('f_loop', 'No tool calls → action = done',
    I('openai_agentic_loop', 'response', null, ['*action: done'])),
  A('f_store', 'sqlite', RES, E.store, 'Persist resp_turn3',
    I('openai_responses_store', 'response', ...storeLines('resp_turn3'))),
  A('f_stream', 'client', RES, E.out_cli, 'SSE: report text, response.completed resp_turn3',
    I('openai_stream_events → sre-assistant', 'response', SSE_H, completedSSE('resp_turn3', '# Incident report INC-4867: ...'))),
  A('client', 'sre', RES, E.cli_sre, 'Incident report: summary, impact, timeline, root cause, resolution, follow-ups',
    I('sre-assistant output', 'response', ['stdout'], [
      '# Incident report INC-4867: checkout errors after database credential rotation',
      '**Severity:** SEV1   **Status:** Mitigated', '## Summary', '## Impact', '## Timeline (UTC, 2026-10-22)',
      '## Root cause', '## Evidence', '## Resolution', '+## Follow-up actions: Secret-change-triggered restart (Reloader)'])),
]);

const diagram = {
  meta: { title: 'Shop outage demo · Praxis Responses flow' },
  canvas: { width: 1340, height: 945 },
  nodes,
  tooltips,
  flows: {
    turn1: { label: '1. "Is my shop website running ok?"', steps: turn1.steps },

    turn3: { label: '3. "create an incident report"', steps: turn3.steps },

  flowOrder: ['turn1', 'turn2', 'turn3'],
