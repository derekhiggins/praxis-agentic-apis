# Settings shared with the praxis-gateway subchart, which renders its pipeline
# config (praxis-gateway.praxisConfig.byo.inline) from them.
global:
  inference:
    # OpenAI-compatible HTTPS Chat Completions backend hostname, also used as TLS SNI.
    host: api.openai.com
    port: 443
    # Secret holding the backend key under OPENAI_API_KEY.
    secretName: openai
  ogx:
    namespace: redhat-ods-applications
    service: ogx-distribution-service
    port: 8321
    # host:port override. Defaults to <service>.<namespace>.svc.cluster.local:<port>.
    endpoint: ""
    networkPolicy:
      # Allow this release's Praxis pods to reach OGX pods in ogx.namespace.
      enabled: true
      podSelector:
        app: ogx
        app.kubernetes.io/instance: ogx-distribution
  mcp:
    # MCP server for the mcp-server connector.
    serverUrl: http://openshift-mcp:8080/mcp
  webSearch:
    # Brave web search.
    enabled: false
    # Secret holding the Brave key under WEB_SEARCH_API_KEY. Needed only when enabled.
    secretName: brave-search
  database:
    # External PostgreSQL hostname. Empty deploys the in-chart PostgreSQL.
    host: ""
    port: 5432
    name: praxis
    user: praxis
    # disable, prefer, require, verify-ca, or verify-full. Empty: disable for the
    # in-chart PostgreSQL, verify-full for an external host.
    sslMode: ""
    # Secret holding the password under POSTGRESQL_PASSWORD. Empty: <release>-postgres.
    # The in-chart PostgreSQL creates it when missing.
    secretName: ""

openshiftMcp:
  # Requires the MCP Lifecycle Operator and MCPServer CRD.
  enabled: true
  image: registry.redhat.io/openshift-mcp/openshift-mcp-server-rhel9@sha256:a551fd58f7b2a7505a76ba2109ae5a8f031606605490c9c68d60f91f502f6fe5
  operatorNamespace: redhat-ods-applications

postgres:
  image: quay.io/sclorg/postgresql-16-c9s@sha256:1e47f477e07d4378179a21f9cc88402ad39aa32789e0cd62fe2cef16c2a7bbdf
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

praxis-gateway:
  image:
    repository: ghcr.io/praxis-proxy/ai
    tag: latest-experimental
    digest: sha256:458ab783a75809c7c091aff25f6c67034380d574022cde2d8b0c3b3cbe22e48c

  # /ready would fail while any upstream is down.
  health:
    readiness:
      exec:
        command: [wget, -qO-, http://127.0.0.1:9901/healthy]

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # Same-namespace pods only.
  networkPolicy:
    enabled: true
    from:
      - podSelector: {}

  # Credential Secrets, named by global.*.secretName.
  envTpl: true
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: "{{ .Values.global.inference.secretName }}"
          key: OPENAI_API_KEY
    - name: WEB_SEARCH_API_KEY
      valueFrom:
        secretKeyRef:
          name: "{{ .Values.global.webSearch.secretName }}"
          key: WEB_SEARCH_API_KEY
          optional: true
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ include "praxis-agentic-apis.postgresSecret" . }}'
          key: POSTGRESQL_PASSWORD

  praxisConfig:
    byo:
      tpl: true
      inline: |
        {{- $g := .Values.global }}
        {{- $ogx := $g.ogx.endpoint | default (printf "%s.%s.svc.cluster.local:%d" $g.ogx.service $g.ogx.namespace (int $g.ogx.port)) }}
        {{- $dbHost := $g.database.host | default (printf "%s-postgres.%s.svc.cluster.local" .Release.Name .Release.Namespace) }}
        {{- $dbUrl := printf "postgres://%s@%s:%d/%s" (urlquery $g.database.user) $dbHost (int $g.database.port) (urlquery $g.database.name) }}
        {{- $sslMode := $g.database.sslMode | default (ternary "verify-full" "disable" (ne $g.database.host "")) }}
        listeners:
          - name: praxis
            address: "0.0.0.0:8080"
            filter_chains: [ingress, responses, execution]

        admin:
          metrics_address: "127.0.0.1:9901"

        filter_chains:
          - name: ingress
            filters:
              - filter: headers
                request_remove: [authorization, x-api-key, x-auth-tenant, x-auth-user, x-authenticated-state-owner, x-user-ogx-key]

              - filter: state_owner
                mode: trusted_headers
                tenant:
                  static: praxis-standalone
                issuer:
                  static: urn:praxis:standalone
                subject:
                  static: praxis-standalone

              - filter: project_state_owner_headers
                tenant_header: x-tenant-id
                subject_header: x-user-id

              - filter: ai_operation

              - filter: openai_responses_request
                initialize_state: false
                on_invalid: continue
                headers:
                  format: x-praxis-ai-format
                  model: x-praxis-ai-model
                  stream: x-praxis-ai-stream
                  mode: x-praxis-responses-mode

              - filter: router
                routes:
                  - path_prefix: /v1/files
                    cluster: ogx
                  - path_prefix: /v1/vector_stores
                    cluster: ogx
                  - path_prefix: /v1/conversations
                    cluster: managed-chat
                  - path_prefix: /v1/responses
                    cluster: managed-chat

              # Direct OGX traffic (files, vector stores) branches off here.
              - filter: headers
                conditions:
                  - when:
                      bound_upstream:
                        application_provider: direct
                branch_chains:
                  - name: ogx
                    rejoin: terminal
                    chains:
                      - name: ogx-dispatch
                        filters:
                          - filter: load_balancer
                            cluster_source: bound_upstream
                            clusters:
                              - name: ogx
                                http:
                                  application_provider: direct
                                endpoints:
                                  - "{{ $ogx }}"

          - name: responses
            conditions:
              - unless:
                  bound_upstream:
                    application_provider: direct
            filters:
              - filter: openai_responses_request
                on_invalid: reject
                headers:
                  format: null
                  model: null
                  stream: null
                  mode: null

              - filter: openai_tool_parse

              # The password comes from PGPASSWORD.
              - filter: openai_conversations
                backend: postgres
                database_url: "{{ $dbUrl }}"
                ssl_mode: {{ $sslMode }}
                allow_private_database_url: true
                conversations_table: openai_conversations
                items_table: openai_conversation_items

              # Stores run before IRR so the reverse response path persists composed SSE.
              - filter: openai_responses_store
                backend: postgres
                database_url: "{{ $dbUrl }}"
                ssl_mode: {{ $sslMode }}
                allow_private_database_url: true
                responses_table: openai_responses
                conversations_table: openai_conversations

              - filter: openai_responses_rehydrate

              - filter: openai_mcp_tool_resolve
                connectors:
                  - id: mcp-server
                    server_url: "{{ $g.mcp.serverUrl }}"

          - name: execution
            filters:
              - filter: static_response
                status: 404
                body: '{"error":{"message":"unsupported Responses operation","type":"invalid_request_error"}}'
                headers:
                  - name: Content-Type
                    value: application/json
                conditions:
                  - when:
                      path_prefix: /v1/responses
                  - unless:
                      path: /v1/responses

              - filter: iterative_request_router
                initial_step: inference
                max_iterations: 8
                timeout_ms: 360000
                step_timeout_ms: 300000
                max_response_bytes: 67108864
                max_stream_response_bytes: 67108864
                max_state_bytes: 136314880
                steps:
                  - name: inference
                    filters:
                      - filter: project_state_owner_headers
                        tenant_header: x-tenant-id
                        subject_header: x-user-id

                      - filter: openai_stream_events
                        max_buffer_bytes: 67108864
                        max_events: 200000
                        timeout_secs: 600

                      {{- if $g.webSearch.enabled }}
                      - filter: openai_web_search_dispatch
                        provider: brave
                        api_key:
                          env_var: WEB_SEARCH_API_KEY
                        max_calls_per_round: 32
                      {{- end }}

                      - filter: openai_mcp_dispatch
                        max_calls_per_round: 32
                        max_parallel_calls: 8
                        max_result_bytes: 1048576
                        max_total_result_bytes: 8388608

                      - filter: openai_file_search_dispatch
                        vector_store_url: http://{{ $ogx }}
                        outbound_chain:
                          name: ogx-search
                          filters:
                            - filter: project_state_owner_headers
                              tenant_header: x-tenant-id
                              subject_header: x-user-id
                        timeout_ms: 10000
                        max_response_bytes: 10485760
                        max_total_response_bytes: 67108864
                        max_state_bytes: 136314880
                        on_failure: closed

                      - filter: openai_agentic_loop
                        max_infer_iters: 7
                        # Raised to avoid intermittent "MCP dispatch exceeds a processing limit"
                        # errors on large resources_get results; investigate the parse charge.
                        max_retained_bytes: 268435456

                      - filter: headers
                        request_remove: [x-tenant-id, x-user-id]
                        request_set:
                          - name: Host
                            value: {{ $g.inference.host }}
                          - name: Content-Type
                            value: application/json

                      - filter: load_balancer
                        cluster_source: bound_upstream
                        clusters:
                          - name: managed-chat
                            idle_timeout_ms: 30000
                            http:
                              application_protocol: openai_chat_completions
                              application_provider: managed
                            endpoints: ["{{ $g.inference.host }}:{{ $g.inference.port }}"]
                            tls:
                              sni: {{ $g.inference.host }}

                      - filter: credential_injection
                        clusters:
                          - name: managed-chat
                            header: Authorization
                            env_var: OPENAI_API_KEY
                            header_prefix: "Bearer "

                      - filter: openai_responses_to_chat_completions
                        max_rewritten_body_bytes: 33554432
                        max_emitted_sse_frame_bytes: 50331648
                        max_stream_events: 100000
                        stream_timeout_secs: 300

                      - filter: path_rewrite
                        replace:
                          pattern: "^/v1/responses/?$"
                          replacement: /v1/chat/completions
                        conditions:
                          - when:
                              path: /v1/responses
                              methods: [POST]
                    on_result:
                      - filter: openai_agentic_loop
                        key: action
                        value: loop
                        next: inference
                      - default: true
                        done: true

        insecure_options:
          allow_private_endpoints: true
          allow_private_upstreams: true
