{{- with .Values.global.ogx }}
{{- if .networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-ogx
  namespace: {{ .namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .networkPolicy.podSelector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "praxis-agentic-apis.gatewaySelector" $ | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- end }}
