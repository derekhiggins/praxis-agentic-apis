# Single-replica PostgreSQL for Praxis Responses and Conversations state.
# scripts/deploy.sh substitutes ${RELEASE} and ${DATABASE_PORT}, creates the
# ${RELEASE}-postgres Secret (POSTGRESQL_USER, POSTGRESQL_PASSWORD,
# POSTGRESQL_DATABASE) if it is
# missing, and applies this file in $NAMESPACE unless DATABASE_HOST is set.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${RELEASE}-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: "${RELEASE}"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RELEASE}-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: "${RELEASE}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: "${RELEASE}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: "${RELEASE}"
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s@sha256:1e47f477e07d4378179a21f9cc88402ad39aa32789e0cd62fe2cef16c2a7bbdf
          envFrom:
            - secretRef:
                name: ${RELEASE}-postgres
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: [/usr/libexec/check-container]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/libexec/check-container, --live]
            initialDelaySeconds: 120
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${RELEASE}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: ${RELEASE}-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: "${RELEASE}"
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: "${RELEASE}"
  ports:
    - name: postgresql
      port: ${DATABASE_PORT}
      targetPort: postgresql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${RELEASE}-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: "${RELEASE}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: "${RELEASE}"
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-gateway
              app.kubernetes.io/instance: "${RELEASE}"
      ports:
        - protocol: TCP
          port: 5432
