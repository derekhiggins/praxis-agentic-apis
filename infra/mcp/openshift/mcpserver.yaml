apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-viewer-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-viewer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server-config
data:
  config.toml: |
    log_level = 2
    port = "8080"
    read_only = false
    disable_destructive = false
    toolsets = ["core"]
    # Read tools plus pods_delete; RBAC limits what pods_delete can reach.
    enabled_tools = [
      "events_list", "namespaces_list", "pods_get", "pods_list", "pods_list_in_namespace",
      "pods_log", "pods_top", "projects_list", "resources_get", "resources_list",
      "pods_delete",
    ]
---
apiVersion: mcp.x-k8s.io/v1beta1
kind: MCPServer
metadata:
  name: openshift-mcp
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: registry.redhat.io/openshift-mcp/openshift-mcp-server-rhel9@sha256:a551fd58f7b2a7505a76ba2109ae5a8f031606605490c9c68d60f91f502f6fe5
  config:
    port: 8080
    path: /mcp
    arguments: [--config, /etc/mcp-config/config.toml]
    storage:
      - path: /etc/mcp-config
        permissions: ReadOnly
        source:
          type: ConfigMap
          configMap:
            name: openshift-mcp-server-config
  network:
    ingressFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: praxis-gateway
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: redhat-ods-applications
        podSelector:
          matchLabels:
            app.kubernetes.io/name: mcp-lifecycle-operator
  runtime:
    security:
      serviceAccountName: mcp-viewer
