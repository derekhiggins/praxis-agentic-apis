apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-test
  template:
    metadata:
      labels:
        app: mcp-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: everything
          image: registry.access.redhat.com/ubi9/nodejs-24-minimal@sha256:7e0cae2be048049c6c052ca1b7d402301679fcd53b3bcf53ea3d90c96c9c5b72
          workingDir: /tmp
          command: [npx]
          args: [--yes, "@modelcontextprotocol/server-everything@2.0.0", streamableHttp]
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/npm
            - name: PORT
              value: "3001"
          ports:
            - name: mcp
              containerPort: 3001
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mcp
          livenessProbe:
            tcpSocket:
              port: mcp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-test
spec:
  selector:
    app: mcp-test
  ports:
    - name: mcp
      port: 3001
      targetPort: mcp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-test
spec:
  podSelector:
    matchLabels:
      app: mcp-test
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-gateway
      ports:
        - protocol: TCP
          port: 3001
